services:
  db:
    image: postgis/postgis:17-3.5
    # The official PostGIS image is amd64-only; Apple Silicon runs it under emulation.
    # Using the same image as CI keeps local and CI databases identical.
    platform: linux/amd64
    environment:
      POSTGRES_USER: flextravel
      POSTGRES_PASSWORD: flextravel
      POSTGRES_DB: flextravel
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, on first start, after the image's own PostGIS setup script.
      - ./backend/docker/create-test-db.sql:/docker-entrypoint-initdb.d/20-create-test-db.sql:ro
    healthcheck:
      # Check over TCP: during first-start setup Postgres runs a temporary socket-only
      # server, which a socket check would wrongly report as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U flextravel -d flextravel"]
      interval: 2s
      timeout: 5s
      retries: 30

  # OpenTripPlanner: the interim routing engine (ADR-0014), until our own RAPTOR replaces it.
  # Serves the graph that `make data` builds into data/work/otp/.
  otp:
    image: opentripplanner/opentripplanner:2.10.0
    command: ["--load", "--serve"]
    environment:
      JAVA_OPTS: -Xmx3g
    ports:
      - "8080:8080"
    volumes:
      - ./data/work/otp:/var/opentripplanner
      - ./otp/build-config.json:/var/opentripplanner/build-config.json:ro
      - ./otp/router-config.json:/var/opentripplanner/router-config.json:ro
      - ./otp/otp-config.json:/var/opentripplanner/otp-config.json:ro
    healthcheck:
      # The image has no curl or wget, but bash (not sh) can speak HTTP over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /otp/actuators/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  db-data:
